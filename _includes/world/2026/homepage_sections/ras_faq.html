{% assign ras_faq = site.data.world['2026'].ras_faq %}

<section class="ras-faq">
  <div class="ras-faq__box">
    <h2 class="ras-faq__title">FAQs</h2>

    <ul class="faq-list" role="list">
      {% for item in ras_faq %}
        <li class="faq-item">
          <input type="checkbox" id="ras-faq-{{ forloop.index }}" class="faq-toggle">
          <label for="ras-faq-{{ forloop.index }}" class="faq-question">
            <span>{{ item.question }}</span>
            <span class="faq-chevron" aria-hidden="true"></span>
          </label>
          <div class="faq-answer">
            <div class="faq-answer__inner">{{ item.answer }}</div>
          </div>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
